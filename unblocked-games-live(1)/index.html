<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameHub</title><link rel="stylesheet" href="style.css"></head>
<body><header><a class="logo" href="#">Game<span>Hub</span></a><input id="search" placeholder="Search games..."></header>
<main><section class="hero"><div><b>BROWSER GAMES</b><h1>Play games instantly.</h1><p>A simple game library powered by <code>games.json</code>.</p></div></section>
<div class="toolbar"><h2>Games</h2><select id="cat"><option value="all">All categories</option></select></div><section id="grid"></section><p id="empty" class="empty">No games found.</p></main>
<div id="modal" class="modal"><div class="player"><div class="head"><div><small id="mcat"></small><h2 id="mtitle"></h2></div><button id="close">×</button></div><iframe id="frame" allowfullscreen></iframe></div></div>
<script src="script.js"></script></body></html>
